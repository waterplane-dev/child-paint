name: CI

# Auto-triggers removed 2026-09-11. These checks now run locally, on `git push`,
# via the repo's pre-push hook -- GitHub Actions minutes on a private repo are
# billed, and a macOS runner bills at 10x. The job definition below is kept so
# the pipeline is still documented and can be run by hand from the Actions tab.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up JDK 17
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0

      # Release builds are deliberately unsigned without keystore.properties,
      # which is never in the repository, so CI stops at the debug build, the
      # unit tests, and lint.
      - name: Build, test and lint
        run: ./gradlew assembleDebug testDebugUnitTest lint

      - name: Upload test and lint reports
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: reports
          path: |
            app/build/reports/tests/
            app/build/reports/lint-results-debug.html
          if-no-files-found: ignore
